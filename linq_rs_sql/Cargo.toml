[package]
name = "linq_rs_sql"
version = "0.1.0"
edition = "2021"
rust-version = "1.65"
description = "A typed SQL query builder — compile-time checked columns, bound parameters, no driver and no dependencies"
license = "MIT OR Apache-2.0"
keywords = ["sql", "query", "builder", "typed"]
categories = ["database"]
readme = "README.md"
documentation = "https://docs.rs/linq_rs_sql"
repository = "https://github.com/TRget88/LinqLikeForRust"

# Deliberately none, like its sibling. This crate builds SQL text; executing it
# is your driver's job, so it needs no driver and no runtime.
[dependencies]

# linq_rs is a DEV-dependency only, so the seam's tests can prove that
# `.to_memory()` hands back something the full LinqExt surface works on.
# Dev-dependencies never enter a consumer's dependency graph -- measured
# earlier in this project -- so D-020's "neither crate depends on the other"
# still holds for anyone who actually uses either crate.
[dev-dependencies]
# The `version` is not redundant with the `path`: a path-only dev-dependency is
# STRIPPED from the published manifest, which would leave `tests/seam.rs`
# referencing a crate the tarball cannot resolve -- and D-013 keeps `tests/` in
# the tarball precisely so the test count is checkable from the artifact.
# It also fixes the publish order: `linq_rs 0.2.0` must be live first.
linq_rs = { path = "..", version = "0.2" }
