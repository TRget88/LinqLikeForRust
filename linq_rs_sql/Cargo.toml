[package]
name = "linq_rs_sql"
version = "0.3.0"
edition = "2021"
rust-version = "1.65"
description = "A typed SQL query builder — compile-time checked columns, bound parameters, no driver and no dependencies"
license = "MIT OR Apache-2.0"
keywords = ["sql", "query", "builder", "typed"]
categories = ["database"]
readme = "README.md"
documentation = "https://docs.rs/linq_rs_sql"
repository = "https://github.com/TRget88/LinqLikeForRust"

# Deliberately none, like its sibling. This crate builds SQL text; executing it
# is your driver's job, so it needs no driver and no runtime.
[dependencies]

# Deliberately none. D-032 PERMITS `linq_rs` here -- it is the one dependency this
# crate may have -- and nothing else, ever. It is still empty because a dev-dep on
# `linq_rs` would force a publish ORDER: `cargo package` strips a dev-dep's `path`
# and keeps its `version`, making it a hard registry requirement, so `linq_rs`
# would have to be live before this crate could be packaged at all. The
# cross-crate seam tests live in `seam-tests` (`publish = false`) instead.
# See D-032, which extends D-024.
[dev-dependencies]
